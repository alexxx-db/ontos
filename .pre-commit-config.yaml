# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  # Python - Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^src/backend/
      - id: ruff-format
        files: ^src/backend/

  # Frontend - ESLint
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c 'cd src/frontend && pnpm run lint:fix'
        language: system
        files: ^src/frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # Frontend - Prettier
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd src/frontend && pnpm run format'
        language: system
        files: ^src/frontend/src/.*\.(ts|tsx|css)$
        pass_filenames: false

  # Frontend - TypeScript Type Check
  - repo: local
    hooks:
      - id: typescript
        name: typescript
        entry: bash -c 'cd src/frontend && pnpm run type-check'
        language: system
        files: ^src/frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

  # uv.lock sync check: dependencies changed but the lockfile was not regenerated.
  # Enforcement starts once src/uv.lock exists at HEAD; before that the migration
  # itself cannot satisfy the check on a machine without index access.
  - repo: local
    hooks:
      - id: check-uv-lock
        name: check-uv-lock
        entry: bash -c 'if git cat-file -e HEAD:src/uv.lock 2>/dev/null && git diff --cached --name-only | grep -q "src/pyproject.toml$"; then if ! git diff --cached --name-only | grep -q "src/uv.lock$"; then echo "ERROR: pyproject.toml dependencies changed but uv.lock was not updated." && echo "Run uv lock in src/ and stage the updated uv.lock." && exit 1; fi; fi'
        language: system
        files: src/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
