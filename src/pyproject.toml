[build-system]
# hatchling capped <1.32: 1.32.0 enforces "readme must be within the project
# directory" and rejects this package's ``readme = "../README.md"`` (the README
# lives at the repo root, one level above src/). Uncapped, a fresh CI/dev env
# pulls 1.32.x and every hatch-built job fails at metadata generation. Cap until
# the readme is relocated into src/ or the field is made project-local.
requires = ["hatchling>=1.21.0,<1.32"]
build-backend = "hatchling.build"

[project]
name = "ontos"
version = "1.1.0"
description = "A Business Catalog for the Databricks Platform"
readme = "../README.md"
authors = [
    { name="Databricks", email="ontos-support@databricks.com" }
]
license = {text = "Databricks License"}
# The Databricks Apps runtime is CPython 3.11 (Hello Abacus ADR-0001). Keep the
# range exact so `uv lock` and scripts/build_artifact.sh resolve the same
# interpreter the app deploys on.
requires-python = ">=3.11,<3.12"

# Direct dependencies are pinned exact (`==`), matching the Hello Abacus
# dependency standard; transitive versions live in uv.lock. Regenerate the lock
# after editing: `uv lock` (checked by `uv lock --check` / `uv sync --locked`).
dependencies = [
    "alembic==1.20.0",
    "bcrypt==5.0.0",
    "bleach==6.4.0",
    "databricks-sdk==0.148.0",
    "databricks-sql-connector==4.5.0",
    "databricks-sqlalchemy==2.0.10",
    "fastapi==0.141.1",
    "filelock==3.32.5",
    "flask-cors==6.0.5",
    "fpdf2==2.8.9",
    "GitPython==3.1.62",
    "google-cloud-bigquery==3.41.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "mlflow==3.17.1",
    "numpy==2.2.6",
    "openai==3.35.1",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "psycopg2-binary==2.9.13",
    "pyarrow==24.0.0",
    "pydantic==2.13.5",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "pytz==2026.5",
    "pyyaml==6.0.3",
    "rdflib==7.6.0",
    "reportlab==5.0.1",
    "requests==2.34.2",
    "six==1.17.0",
    "sqlalchemy==2.0.52",
    "sse-starlette==3.4.11",
    "typing-extensions==4.16.0",
    "uvicorn==0.54.0",
    "werkzeug==3.1.8",
]

# The ontos backend ships as copied source in app_artifact/, not an installed
# wheel, so uv manages the dev environment without building the project itself.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=3.0.0",
    "pytest==9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "ruff>=0.8.0",
    "pip-licenses==5.5.5",
]
e2e = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "backend",
    "pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "backend",
  "backend/src"
]
# NOTE: backend/src/tests/unit/ holds the bulk of the unit tests. The legacy
# backend/tests/ dir is kept for the few suites that haven't migrated yet.
# importlib mode lets us collect both trees without test-module name collisions.
testpaths = ["backend/src/tests/unit", "backend/tests"]
addopts = [
    "--cov=backend/src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--import-mode=importlib",
    "-v",
]
asyncio_mode = "strict"

[tool.coverage.run]
source = ["backend/src"]
# Record repo-relative file paths (e.g. "backend/src/app.py") instead of paths
# relative to the source root ("app.py"). Codecov's path fix in codecov.yml
# (`backend/::src/backend/`) only matches paths that start with "backend/", so
# without this the backend files never resolve against the repo tree and the
# `backend` flag badge reported a diluted number instead of the real coverage.
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/migrations/*",
    "*/alembic/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "backend/htmlcov"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI depends)
    "B904",   # raise without from (too noisy for existing code)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
